    </div>
  </main>

  <footer class="app-footer">
    <div class="container-1440 app-footer-inner">
      <div id="footer-info"></div>
      <div class="app-footer-links" id="footer-links"></div>
    </div>
  </footer>

</div>

<div class="nav-backdrop" id="navBackdrop"></div>

<script>
// ---------------------------------------------------------------------------
// DIRECTORY LISTING REWRITE
// ---------------------------------------------------------------------------
function buildBreadcrumb() {
  var path  = decodeURIComponent(window.location.pathname);
  var parts = path.split('/').filter(Boolean);
  var html  = 'Index of ';

  if (parts.length === 0) {
    html += '/';
  } else {
    var accum = '';
    parts.forEach(function(part, i) {
      accum += '/' + part;
      if (i < parts.length - 1) {
        html += '<a href="' + accum + '/">' + part + '</a>/';
      } else {
        html += part + '/';
      }
    });
  }

  var bc = document.createElement('span');
  bc.className = 'breadcrumb';
  bc.innerHTML = html;
  return bc;
}

function runDirectoryRewrite() {
  var pre = document.querySelector('pre');
  if (!pre) return;

  var lines = pre.innerHTML.split('\n');
  var entries = [];

  lines.forEach(function(line) {
    if (!line.trim() || line.indexOf('?C=') !== -1) return;
    var hrefMatch  = line.match(/href="([^"]+)"/);
    var labelMatch = line.match(/>([^<]+)<\/a>/);
    if (!hrefMatch || !labelMatch) return;
    var href  = hrefMatch[1];
    var label = labelMatch[1].trim();
    if (href.startsWith('?')) return;

    var plain = line.replace(/<[^>]+>/g, '').trim();
    var parts = plain.split(/\s{2,}/);
    var date = '';
    var size = '';
    var desc = '';
    for (var i = 0; i < parts.length; i++) {
      if (/^\d{4}-\d{2}-\d{2}/.test(parts[i].trim())) {
        date = parts[i].trim();
        size = (parts[i + 1] || '').trim();
        desc = (parts[i + 2] || '').trim();
        break;
      }
    }

    var isDir    = href.endsWith('/');
    var isParent = (label === 'Parent Directory' || href === '../');
    entries.push({
      href: href,
      label: label,
      date: date,
      size: isDir ? '-' : (size || '-'),
      desc: desc,
      isDir: isDir,
      isParent: isParent,
    });
  });

  var card = document.createElement('div');
  card.className = 'card';
  card.appendChild(buildBreadcrumb());

  var table = document.createElement('table');
  table.className = 'modern-file-table';
  table.innerHTML =
    '<thead><tr>' +
      '<th class="col-icon">Type</th>' +
      '<th class="col-name">Name</th>' +
      '<th class="col-date hide-under-tablet">Last modified</th>' +
      '<th class="col-size hide-under-tablet">Size</th>' +
      '<th class="col-desc">Description</th>' +
    '</tr></thead>' +
    '<tbody id="dir-tbody"></tbody>';

  function iconFor(entry) {
    if (entry.isParent) return 'bi-arrow-up-circle';
    if (entry.isDir) return 'bi-folder2';
    var ext = entry.label.split('.').pop().toLowerCase();
    var map = {
      html: 'bi-filetype-html', htm: 'bi-filetype-html',
      php: 'bi-filetype-php',   inc: 'bi-filetype-php',
      js: 'bi-filetype-js',     mjs: 'bi-filetype-js',
      ts: 'bi-filetype-ts',     tsx: 'bi-filetype-tsx',
      css: 'bi-filetype-css',   jsx: 'bi-filetype-jsx',
      json: 'bi-filetype-json', jsonc: 'bi-filetype-json',
      xml: 'bi-file-code',      xsl: 'bi-file-code',    xslt: 'bi-file-code',
      yaml: 'bi-file-code',     yml: 'bi-file-code',
      toml: 'bi-file-code',     ini: 'bi-file-code',    cfg: 'bi-file-code', conf: 'bi-file-code',
      env: 'bi-file-code',
      txt: 'bi-file-text',      md: 'bi-file-text',     markdown: 'bi-file-text',
      pdf: 'bi-file-pdf',       csv: 'bi-file-spreadsheet', log: 'bi-file-text',
      db: 'bi-database',        sqlite: 'bi-database',  sqlite3: 'bi-database', sql: 'bi-database',
      zip: 'bi-file-zip',       tar: 'bi-file-zip',     gz: 'bi-file-zip',   gzip: 'bi-file-zip',
      tgz: 'bi-file-zip',       '7z': 'bi-file-zip',    rar: 'bi-file-zip',
      png: 'bi-file-image',     jpg: 'bi-file-image',   jpeg: 'bi-file-image',
      gif: 'bi-file-image',     webp: 'bi-file-image',  bmp: 'bi-file-image',
      tiff: 'bi-file-image',    tif: 'bi-file-image',   ico: 'bi-file-image',
      svg: 'bi-filetype-svg',
      mp4: 'bi-file-play',      mkv: 'bi-file-play',    avi: 'bi-file-play',
      mov: 'bi-file-play',      wmv: 'bi-file-play',    flv: 'bi-file-play',  webm: 'bi-file-play',
      mp3: 'bi-file-music',     wav: 'bi-file-music',   flac: 'bi-file-music',
      ogg: 'bi-file-music',     aac: 'bi-file-music',   m4a: 'bi-file-music',
      sh: 'bi-terminal',        bash: 'bi-terminal',    zsh: 'bi-terminal',
      py: 'bi-filetype-py',     rb: 'bi-file-code',
      pl: 'bi-file-code',       pm: 'bi-file-code',
      bat: 'bi-terminal',       cmd: 'bi-terminal',
    };
    return map[ext] || 'bi-file-earmark';
  }

  var tbody = table.querySelector('#dir-tbody');
  entries.forEach(function(e) {
    var tr = document.createElement('tr');
    tr.dataset.name = decodeURIComponent(e.href);
    tr.innerHTML =
      '<td class="col-icon"><i class="bi ' + iconFor(e) + '"></i></td>' +
      '<td class="col-name"><a href="' + e.href + '">' + e.label + '</a></td>' +
      '<td class="col-date hide-under-tablet" title="' + (e.date || '') + '">' +
        (evoDirRelativeTime && e.date ? relativeTime(e.date) : (e.date || '-')) +
      '</td>' +
      '<td class="col-size hide-under-tablet">' +
        e.size +
      '</td>' +
      '<td class="col-desc entry-desc">' +
        (e.desc || '') +
      '</td>';
    tbody.appendChild(tr);
  });

  card.appendChild(table);
  pre.parentNode.replaceChild(card, pre);

  // Zone: content-bottom - future modules load here (after directory listing)
  if (!document.getElementById('evodir-zone-content-bottom')) {
    var bottomZone = document.createElement('div');
    bottomZone.id = 'evodir-zone-content-bottom';
    card.parentNode.insertBefore(bottomZone, card.nextSibling);
  }

  fetch('/.includes/api.php?action=descriptions&path=' + encodeURIComponent(window.location.pathname))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      Object.keys(data).forEach(function(name) {
        var row = table.querySelector('tr[data-name="' + name + '"]');
        if (!row) return;

        var entry   = data[name];
        var desc    = typeof entry === 'object' ? entry.description : entry;
        var version = typeof entry === 'object' ? entry.version    : null;

        if (version) {
          var nameCell = row.querySelector('.col-name a');
          if (nameCell) {
            var tag = document.createElement('span');
            tag.className = 'evodir-version-tag';
            tag.textContent = 'v' + version;
            nameCell.parentNode.appendChild(tag);
          }
        }

        var cell = row.querySelector('.entry-desc');
        if (cell && !cell.textContent.trim() && desc) {
          cell.textContent = desc;
        }
      });
    })
    .catch(function() {});
}

// ---------------------------------------------------------------------------
// RELATIVE TIME FORMATTER
// ---------------------------------------------------------------------------
function relativeTime(dateStr) {
  if (!dateStr) return dateStr;
  var parts = dateStr.trim().split(/[\s:]/);
  if (parts.length < 2) return dateStr;
  var dateParts = parts[0].split('-');
  if (dateParts.length < 3) return dateStr;
  var d = new Date(
    parseInt(dateParts[0]),
    parseInt(dateParts[1]) - 1,
    parseInt(dateParts[2]),
    parts[1] ? parseInt(parts[1]) : 0,
    parts[2] ? parseInt(parts[2]) : 0
  );
  if (isNaN(d.getTime())) return dateStr;
  var diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diff < 60)       return 'Just now';
  if (diff < 3600)     return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400)    return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800)   return Math.floor(diff / 86400) + 'd ago';
  if (diff < 2592000)  return Math.floor(diff / 604800) + 'w ago';
  if (diff < 31536000) return Math.floor(diff / 2592000) + 'mo ago';
  return Math.floor(diff / 31536000) + 'y ago';
}

// ---------------------------------------------------------------------------
// BANNER RENDERER
// Renders as .actionbar > .notice — same component every other status
// message on the page uses, no bespoke styling of its own.
// ---------------------------------------------------------------------------
function renderBanner() {
  var zone = document.getElementById('evodir-zone-content-top');
  if (!zone) return;
  fetch('/.includes/api.php?action=banner')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.enabled) return;
      if (d.dismissible && sessionStorage.getItem('evodir-banner-dismissed')) return;

      zone.innerHTML = '';

      var bar = document.createElement('div');
      bar.className = 'actionbar';

      var notice = document.createElement('div');
      notice.className = 'notice';
      notice.id = 'evodir-banner';

      var icon = document.createElement('i');
      icon.className = 'bi bi-info-circle-fill';
      notice.appendChild(icon);

      var content = document.createElement('div');
      if (d.title) {
        var title = document.createElement('strong');
        title.textContent = d.title;
        content.appendChild(title);
      }
      if (Array.isArray(d.lines)) {
        d.lines.forEach(function(line) {
          if (!line) return;
          var p = document.createElement('p');
          p.innerHTML = line;
          content.appendChild(p);
        });
      }
      notice.appendChild(content);

      if (d.dismissible) {
        var closeBtn = document.createElement('button');
        closeBtn.className = 'notice-dismiss';
        closeBtn.type = 'button';
        closeBtn.setAttribute('aria-label', 'Dismiss');
        closeBtn.innerHTML = '<i class="bi bi-x-lg"></i>';
        closeBtn.addEventListener('click', function() {
          bar.style.display = 'none';
          sessionStorage.setItem('evodir-banner-dismissed', 'true');
        });
        notice.appendChild(closeBtn);
      }

      bar.appendChild(notice);
      zone.appendChild(bar);
    })
    .catch(function() {});
}

// ---------------------------------------------------------------------------
// INIT
// ---------------------------------------------------------------------------
var evoDirRelativeTime = false;

function init() {
  window.setTimeout(runDirectoryRewrite, 1000);
  window.setTimeout(renderBanner, 1200);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// ---------------------------------------------------------------------------
// FOOTER — links and server info from config
// ---------------------------------------------------------------------------
fetch('/.includes/api.php?action=config')
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.relativeTime) evoDirRelativeTime = d.relativeTime;

    if (d.showLegal && d.footer && d.footer.length > 0) {
      var linksEl = document.getElementById('footer-links');
      d.footer.forEach(function(fl) {
        var a = document.createElement('a');
        a.href = fl.url;
        a.textContent = fl.label;
        linksEl.appendChild(a);
      });
    }

    var parts = [];
    if (d.siteName) parts.push(d.siteName);
    if (d.apacheVer) parts.push('Apache/' + d.apacheVer);
    if (d.phpVer) parts.push('PHP/' + d.phpVer);

    // Use a dedicated child span instead of setting textContent on
    // #footer-info directly — other modules (e.g. theme-selector) may
    // append their own elements there, and textContent would wipe them
    // if this fetch happens to resolve after that module's does.
    var infoEl = document.getElementById('footer-info');
    var textSpan = infoEl.querySelector('.footer-info-text');
    if (!textSpan) {
      textSpan = document.createElement('span');
      textSpan.className = 'footer-info-text';
      infoEl.insertBefore(textSpan, infoEl.firstChild);
    }
    textSpan.textContent = parts.join(' \u2014 ');
  })
  .catch(function() {});
</script>

<script src="/.includes/js/responsive.js"></script>
