<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvoDir</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/.includes/css/style.css">
<!-- No href by default — default theme is style.css alone. The
     theme-selector module sets this href when a theme is actually
     chosen; evodir.conf's blank theme| means it won't fire on load. -->
<link id="evodir-theme" rel="stylesheet">
</head>
<body>

<div class="app-shell" id="appShell">

  <header class="app-header">
    <div class="app-navbar">
      <div class="app-navbar-brand">
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="appSidebar">
          <i class="bi bi-list"></i>
        </button>
        <span id="sidebar-name">LOADING</span>
        <span class="hide-under-tablet app-navbar-subtitle" id="sidebar-label">Homelab</span>
      </div>
      <div class="app-navbar-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Choose theme" aria-haspopup="true">
          <i class="bi bi-palette2"></i>
        </button>
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="appSidebar">
          <i class="bi bi-layout-sidebar"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="app-sidebar" id="appSidebar">

    <div class="sidebar-clock" id="sidebar-clock">--:--:--</div>

    <!-- Zone: sidebar-top - weather module injects here (replaces clock) -->
    <div id="evodir-zone-sidebar-top"></div>

    <div id="sidebar-nav"></div>

    <!-- Zone: sidebar-bottom - stats/livestats module injects here -->
    <div id="evodir-zone-sidebar-bottom"></div>

    <div class="sidebar-meta">
      <h4>Config Metrics</h4>
      <p>Modules Enabled: <strong id="sidebar-modules-enabled">&mdash;</strong></p>
      <p>Theme name: <strong class="themename"></strong></p>
    </div>

  </div>

  <script>
  fetch('/.includes/api.php?action=config')
    .then(function(r) { return r.json(); })
    .then(function(d) {

      // Identity
      if (d.siteName) document.getElementById('sidebar-name').textContent  = d.siteName;
      if (d.label)    document.getElementById('sidebar-label').textContent = d.label;
      if (d.siteName) document.title = d.siteName;

      // Theme
      if (d.theme) {
        document.getElementById('evodir-theme').href = '/.includes/themes/' + d.theme + '.css';
      }

      // Navigation
      if (d.nav) {
        var html     = '';
        var sections = Object.keys(d.nav);
        sections.forEach(function(sectionName, idx) {
          html += '<h2>' + sectionName + '</h2><nav><ul>';
          d.nav[sectionName].forEach(function(link) {
            var target = link.url.indexOf('http') === 0 ? ' target="_blank"' : '';
            html += '<li><a href="' + link.url + '"' + target + '>';
            html += '<i class="bi ' + link.icon + '"></i> ' + link.label;
            html += '</a></li>';
          });
          html += '</ul></nav>';
          if (idx < sections.length - 1) html += '<hr>';
        });
        document.getElementById('sidebar-nav').innerHTML = html;
      }

      // Config Metrics — enabled module list
      if (d.modules) {
        var enabled = Object.keys(d.modules).filter(function(name) { return d.modules[name]; });
        document.getElementById('sidebar-modules-enabled').textContent =
          enabled.length ? enabled.join(', ') : 'None';
      }

      // Hide clock if weather module is enabled (weather widget replaces it)
      if (d.modules && d.modules.weather) {
        var clock = document.getElementById('sidebar-clock');
        if (clock) clock.style.display = 'none';
      }

      // Dynamically load enabled module JS files. ?v= is the module's
      // module.js mtime (from the config response) so a redeployed
      // module always gets fetched fresh instead of a stale cached
      // copy silently running against a changed API response shape.
      if (d.modules) {
        Object.keys(d.modules).forEach(function(name) {
          if (d.modules[name]) {
            var v = (d.moduleVersions && d.moduleVersions[name]) || Date.now();
            var s = document.createElement('script');
            s.src = '/.includes/modules/' + name + '/module.js?v=' + v;
            document.head.appendChild(s);
          }
        });
      }

    })
    .catch(function() {
      document.getElementById('sidebar-name').textContent = location.hostname.toUpperCase();
      document.getElementById('sidebar-nav').innerHTML =
        '<p class="sidebar-nav-error">Nav unavailable</p>';
    });

  // Live clock
  (function() {
    function tick() {
      var el = document.getElementById('sidebar-clock');
      if (!el || el.style.display === 'none') return;
      var now = new Date();
      el.textContent =
        String(now.getHours()).padStart(2,'0') + ':' +
        String(now.getMinutes()).padStart(2,'0') + ':' +
        String(now.getSeconds()).padStart(2,'0');
    }
    tick();
    setInterval(tick, 1000);
  })();
  </script>

  <main class="app-main">
    <div class="container-1440">

      <!-- Zone: content-top - banner/kpi module injects here (before directory listing) -->
      <div id="evodir-zone-content-top"></div>
